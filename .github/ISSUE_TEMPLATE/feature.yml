name: Feature request
description: Propose an improvement to CLI or web usage.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected behavior
      description: Explain the result and its effect on CLI, web, and existing data.
    validations:
      required: true
