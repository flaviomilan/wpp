name: Bug report
description: Report unexpected behavior using synthetic data.
body:
  - type: markdown
    attributes:
      value: 'Never send real databases, sessions, QR codes, messages, or tokens. Use Security > Report a vulnerability after the private channel is enabled.'
  - type: textarea
    id: environment
    attributes:
      label: Environment and version
      description: System, wpp version, CLI/web mode, and sanitized command.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps with fictitious content.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed results
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Sanitized logs and validation
